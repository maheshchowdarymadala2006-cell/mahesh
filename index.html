<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f5">
  <title>Local Chat</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #242522;
      background: #f7f7f5;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; }
    .app { width: min(820px, 100%); min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column; padding: 0 24px; }
    header { height: 68px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e9e9e5; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 650; letter-spacing: -.02em; }
    .brand-mark { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 9px; color: white; background: #343832; font-size: 14px; }
    .status { display: flex; align-items: center; gap: 8px; color: #73766f; font-size: 12px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #e5a24a; }
    .dot.online { background: #54a879; }
    main { flex: 1; display: flex; flex-direction: column; }
    .welcome { margin: auto auto 28px; text-align: center; }
    .welcome-mark { width: 50px; height: 50px; display: grid; place-items: center; margin: 0 auto 20px; background: white; border: 1px solid #e9e9e5; border-radius: 17px; font-size: 22px; box-shadow: 0 4px 15px #25281d0a; }
    h1 { margin: 0 0 10px; font-size: clamp(25px, 5vw, 34px); letter-spacing: -.045em; font-weight: 620; }
    .welcome p { margin: 0; color: #777971; font-size: 14px; line-height: 1.6; }
    .suggestions { display: flex; justify-content: center; flex-wrap: wrap; gap: 9px; margin: 0 auto auto; }
    .suggestion { border: 1px solid #e5e5df; background: #fff; color: #575950; border-radius: 999px; padding: 9px 13px; cursor: pointer; font: inherit; font-size: 12px; transition: border-color .15s, background .15s; }
    .suggestion:hover { background: #f0f0eb; border-color: #d4d5ce; }
    #messages { display: flex; flex-direction: column; gap: 22px; padding: 34px 0; }
    .message { display: flex; gap: 11px; align-items: flex-start; max-width: 100%; }
    .message.user { justify-content: flex-end; }
    .avatar { flex: 0 0 27px; height: 27px; display: grid; place-items: center; border: 1px solid #e4e4df; border-radius: 9px; background: #fff; font-size: 12px; }
    .message.assistant .bubble { white-space: pre-wrap; line-height: 1.65; font-size: 14px; padding-top: 3px; }
    .message.user .bubble { max-width: min(78%, 560px); border: 1px solid #e8e8e2; border-radius: 16px 16px 4px 16px; padding: 11px 14px; background: white; font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; }
    .message.error .bubble { color: #a13e35; }
    .typing { color: #85877f; }
    .composer-wrap { position: sticky; bottom: 0; padding: 14px 0 17px; background: linear-gradient(0deg, #f7f7f5 82%, #f7f7f500); }
    form { padding: 10px 11px 10px 16px; display: flex; align-items: flex-end; gap: 10px; border: 1px solid #dedfd8; border-radius: 19px; background: #fff; box-shadow: 0 5px 22px #25281d0a; transition: border-color .15s, box-shadow .15s; }
    form:focus-within { border-color: #b9bbb1; box-shadow: 0 5px 22px #25281d10; }
    textarea { flex: 1; min-height: 25px; max-height: 160px; resize: none; border: 0; outline: 0; color: #292a26; background: transparent; font: inherit; font-size: 14px; line-height: 1.55; padding: 3px 0; }
    textarea::placeholder { color: #a2a39d; }
    .send { width: 34px; height: 34px; flex: 0 0 34px; display: grid; place-items: center; border: 0; border-radius: 11px; color: white; background: #333730; cursor: pointer; transition: background .15s, opacity .15s; }
    .send:hover { background: #4a4e45; }
    .send:disabled { cursor: default; opacity: .42; }
    .send svg { width: 16px; height: 16px; }
    .hint { padding-top: 9px; text-align: center; color: #999a94; font-size: 11px; }
    @media (max-width: 520px) { .app { padding: 0 16px; } header { height: 60px; } .welcome { margin-bottom: 24px; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><span class="brand-mark">✳</span><span>Local Chat</span></div>
      <div class="status"><span class="dot" id="status-dot"></span><span id="status-text">Connecting…</span></div>
    </header>
    <main>
      <section class="welcome" id="welcome">
        <div class="welcome-mark">✳</div>
        <h1>What’s on your mind?</h1>
        <p>A private conversation, powered locally by <span id="model-name">Ollama</span>.</p>
      </section>
      <section class="suggestions" id="suggestions" aria-label="Suggested prompts">
        <button class="suggestion" type="button">Help me brainstorm an idea</button>
        <button class="suggestion" type="button">Explain something simply</button>
        <button class="suggestion" type="button">Write a quick first draft</button>
      </section>
      <section id="messages" aria-live="polite" aria-label="Conversation"></section>
    </main>
    <div class="composer-wrap">
      <form id="chat-form">
        <textarea id="prompt" rows="1" placeholder="Message your local assistant…" aria-label="Message your local assistant"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send message" disabled>
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 15V5m0 0L5.8 9.2M10 5l4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <div class="hint">Enter to send · Shift + Enter for a new line</div>
    </div>
  </div>
  <script>
    const form = document.querySelector("#chat-form");
    const input = document.querySelector("#prompt");
    const sendButton = document.querySelector("#send");
    const messagesElement = document.querySelector("#messages");
    const welcome = document.querySelector("#welcome");
    const suggestions = document.querySelector("#suggestions");
    const conversation = [];
    let busy = false;

    function updateSendButton() {
      sendButton.disabled = busy || !input.value.trim();
    }

    function addMessage(role, text, extraClass = "") {
      const row = document.createElement("div");
      row.className = `message ${role}${extraClass ? ` ${extraClass}` : ""}`;
      if (role === "assistant") {
        const avatar = document.createElement("span");
        avatar.className = "avatar";
        avatar.textContent = "✳";
        row.append(avatar);
      }
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      row.append(bubble);
      messagesElement.append(row);
      row.scrollIntoView({ behavior: "smooth", block: "end" });
      return row;
    }

    async function sendMessage(text) {
      const content = text.trim();
      if (!content || busy) return;
      welcome.hidden = true;
      suggestions.hidden = true;
      addMessage("user", content);
      conversation.push({ role: "user", content });
      input.value = "";
      input.style.height = "auto";
      busy = true;
      updateSendButton();
      const pending = addMessage("assistant", "Thinking…", "typing");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: conversation })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `Request failed (${response.status}).`);
        const reply = result.message.content;
        pending.remove();
        conversation.push({ role: "assistant", content: reply });
        addMessage("assistant", reply);
      } catch (error) {
        pending.remove();
        conversation.pop();
        addMessage("assistant", error.message || "Something went wrong.", "error");
      } finally {
        busy = false;
        updateSendButton();
        input.focus();
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      sendMessage(input.value);
    });
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = `${Math.min(input.scrollHeight, 160)}px`;
      updateSendButton();
    });
    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
    suggestions.addEventListener("click", event => {
      const button = event.target.closest(".suggestion");
      if (button) sendMessage(button.textContent);
    });

    fetch("/api/health")
      .then(response => response.json())
      .then(status => {
        document.querySelector("#status-dot").classList.toggle("online", status.connected);
        document.querySelector("#status-text").textContent = status.connected
          ? `Connected · ${status.model}`
          : `Ollama unavailable · ${status.model}`;
        document.querySelector("#model-name").textContent = status.model;
      })
      .catch(() => {
        document.querySelector("#status-text").textContent = "Ollama unavailable";
      });
  </script>
</body>
</html>
